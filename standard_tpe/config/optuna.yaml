# Standard TPE baseline (Optuna TPESampler, univariate / default TPE).
# Used by standard_tpe/run.py and standard_tpe/run_experiments.py.

seed: 42
n_trials: 20
timeout_seconds: null
n_jobs: 1

sampler:
  name: TPESampler
  seed: 42

pruner:
  # TrialObjective does not call trial.report(), so MedianPruner cannot prune
  # mid-trial; generator failures are still recorded as PRUNED.
  name: MedianPruner
  n_startup_trials: 5
  n_warmup_steps: 0

storage:
  # Per pair: <results_root>/.../<generator>/optuna.db (resume-safe)
  url: auto

artifact:
  save_study_pickle: true
  save_trials_csv: true
  save_best_params_json: true
  save_best_synthetic_csv: true
  save_plots:
    - optimization_history
    - param_importances
    - parallel_coordinate
  snapshot_configs: true

sample_size:
  mode: match_train
  fixed_n: null
