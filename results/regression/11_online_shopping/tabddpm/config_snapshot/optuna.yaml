# Global Optuna study settings (dataset/generator independent).

seed: 42
n_trials: 50
timeout_seconds: null         # or e.g. 86400
n_jobs: 1                     # keep 1 for single-process runs
# For trial-level multi-GPU on ONE pair, use instead:
#   scripts/run_multigpu_trials.py --dataset X --generator Y --n-trials 10 --gpus 0,1,2,3,5


sampler:
  name: TPESampler            # TPESampler | RandomSampler | GridSampler
  seed: 42

pruner:
  name: MedianPruner          # MedianPruner | NopPruner
  n_startup_trials: 5
  n_warmup_steps: 0

storage:
  # null → in-memory; otherwise sqlite URL, e.g.
  # sqlite:///results/optuna_studies.db
  url: null

artifact:
  save_study_pickle: true
  save_trials_csv: true
  save_best_params_json: true
  save_best_synthetic_csv: true
  save_plots:
    - optimization_history
    - param_importances
    - parallel_coordinate
  snapshot_configs: true

# Synthetic sample size relative to real training set size.
sample_size:
  mode: match_train           # match_train | fixed
  fixed_n: null
