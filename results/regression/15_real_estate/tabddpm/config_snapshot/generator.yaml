# TabDDPM — fast HPO profile (forest_cover / overnight runs)
# Smaller step / width / depth than tabddpm.yaml (paper Table 1).

generator: tabddpm
backend: tab_ddpm
references:
  - "Kotelnikov, A., Baranchuk, D., Rubachev, I., & Babenko, A. (2023). TabDDPM: Modelling Tabular Data with Diffusion Models. ICML."
  - "https://github.com/yandex-research/tab-ddpm"

defaults:
  lr: 0.001
  batch_size: 256
  num_timesteps: 100
  steps: 5000
  n_layers: 4
  d_layers: 256
  sample_proportion: 1.0
  dropout: 0.0
  scheduler: cosine
  gaussian_loss_type: mse

search_space:
  lr:
    type: float
    suggest: float
    low: 1.0e-5
    high: 3.0e-3
    log: true
    default: 0.001

  batch_size:
    type: categorical
    suggest: categorical
    choices: [256, 1024]
    default: 256

  num_timesteps:
    type: categorical
    suggest: categorical
    choices: [100, 1000]
    default: 100

  steps:
    type: categorical
    suggest: categorical
    choices: [5000, 10000]
    default: 5000

  n_layers:
    type: categorical
    suggest: categorical
    choices: [2, 4]
    default: 4

  d_layers:
    type: categorical
    suggest: categorical
    choices: [128, 256]
    default: 256

  sample_proportion:
    type: categorical
    suggest: categorical
    choices: [1.0]
    default: 1.0
    explanation: "Match train size so comparison with the other 6 generators is fair."
