# TVAE — Xu et al. (2019) Tabular VAE (same paper as CTGAN)
# SDV TVAESynthesizer defaults: epochs=300, batch=500, embedding_dim=128,
# compress/decompress=[128,128], l2scale=1e-5, loss_factor=2.

generator: tvae
backend: sdv.single_table.TVAESynthesizer
references:
  - "Xu et al. (2019). Modeling Tabular data using Conditional GAN (TVAE section). NeurIPS."
  - "SDV TVAESynthesizer defaults"

defaults:
  epochs: 300
  batch_size: 500
  embedding_dim: 128
  compress_dims: [128, 128]
  decompress_dims: [128, 128]
  l2scale: 1.0e-5
  loss_factor: 2

search_space:
  epochs:
    type: int
    suggest: int
    low: 100
    high: 1000
    step: 50
    default: 300
    explanation: >
      VAE training epochs. Too few → blurry marginals; too many → overfit
      (privacy risk). SDV/paper-aligned default: 300.

  batch_size:
    type: categorical
    suggest: categorical
    choices: [100, 200, 500, 1000]
    default: 500
    explanation: >
      Mini-batch size (SDV default 500). Affects ELBO gradient variance.

  embedding_dim:
    type: categorical
    suggest: categorical
    choices: [32, 64, 128, 256]
    default: 128
    explanation: >
      Latent dimensionality. Bottleneck capacity for joint structure; 128 is
      the SDV default. Too small loses correlations; too large overfits.

  compress_dims:
    type: categorical
    suggest: categorical
    choices:
      - [64, 64]
      - [128, 128]
      - [256, 256]
      - [128, 128, 128]
    default: [128, 128]
    explanation: >
      Encoder MLP hidden widths (compress). Controls how features map into the
      latent space; default [128,128].

  decompress_dims:
    type: categorical
    suggest: categorical
    choices:
      - [64, 64]
      - [128, 128]
      - [256, 256]
      - [128, 128, 128]
    default: [128, 128]
    explanation: >
      Decoder MLP hidden widths (decompress). Should generally match encoder
      capacity; default [128,128].

  l2scale:
    type: float
    suggest: float
    low: 1.0e-6
    high: 1.0e-3
    log: true
    default: 1.0e-5
    explanation: >
      Weight-decay / L2 on network weights (SDV default 1e-5). Regularizes
      against memorization and improves privacy–utility balance.

  loss_factor:
    type: categorical
    suggest: categorical
    choices: [1, 2, 5, 10]
    default: 2
    explanation: >
      Multiplier on reconstruction term vs KL in the TVAE loss (SDV default 2).
      Higher → sharper reconstructions / better fidelity; lower → smoother
      latents / often better privacy.
