# ForestDiffusion — Jolicoeur-Martineau et al. (AISTATS 2024)
# Official defaults (SamsungSAILMontreal/ForestDiffusion): n_t=50,
# duplicate_K=100 (n_noise), diffusion_type='vp'. XGB depth/estimators matter.

generator: forest_diffusion
backend: ForestDiffusion
references:
  - "Jolicoeur-Martineau, A. et al. (2024). Generating and Imputing Tabular Data via Diffusion and Flow-based Gradient-Boosted Trees. AISTATS."
  - "https://github.com/SamsungSAILMontreal/ForestDiffusion"

defaults:
  n_t: 50
  duplicate_K: 100
  diffusion_type: vp
  max_depth: 7
  n_estimators: 100
  eta: 0.3

search_space:
  n_t:
    type: int
    suggest: int
    low: 20
    high: 100
    step: 10
    default: 50
    explanation: >
      Number of noise levels / sampling steps (default 50). Runtime memory
      caps in ForestDiffusionGenerator may shrink this on low-RAM hosts.

  duplicate_K:
    type: categorical
    suggest: categorical
    choices: [50, 75, 100, 150]
    default: 100
    explanation: >
      Noise duplicates per real row (n_noise; paper default 100). Keep the
      Optuna categorical space stable for resume; fit-time caps may shrink K.

  diffusion_type:
    type: categorical
    suggest: categorical
    choices: [vp, flow]
    default: vp
    explanation: >
      'vp' = variance-preserving diffusion; 'flow' = flow-matching. Flow is
      faster and can use smaller n_t; VP often stronger with larger n_t.

  max_depth:
    type: int
    suggest: int
    low: 3
    high: 10
    default: 7
    explanation: >
      XGBoost tree depth. Fit-time caps may reduce depth when MemAvailable is low.

  n_estimators:
    type: categorical
    suggest: categorical
    choices: [50, 100, 200]
    default: 100
    explanation: >
      Boosting rounds per forest. Fit-time caps may reduce this under memory pressure.

  eta:
    type: float
    suggest: float
    low: 0.05
    high: 0.5
    log: true
    default: 0.3
    explanation: >
      XGBoost learning rate (eta). Interacts with n_estimators; lower eta with
      more trees often improves calibration of the reverse process.
