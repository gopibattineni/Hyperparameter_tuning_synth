# ForestDiffusion — fast HPO profile (forest_cover / overnight runs)
# Smaller n_t / duplicate_K / trees than forest_diffusion.yaml

generator: forest_diffusion
backend: ForestDiffusion
references:
  - "Jolicoeur-Martineau, A. et al. (2024). Generating and Imputing Tabular Data via Diffusion and Flow-based Gradient-Boosted Trees. AISTATS."
  - "https://github.com/SamsungSAILMontreal/ForestDiffusion"

defaults:
  n_t: 30
  duplicate_K: 50
  diffusion_type: flow
  max_depth: 5
  n_estimators: 50
  eta: 0.3
  n_jobs: 2

search_space:
  n_t:
    type: int
    suggest: int
    low: 20
    high: 50
    step: 10
    default: 30
    explanation: "Capped at 50 steps for faster forest_cover trials."

  duplicate_K:
    type: categorical
    suggest: categorical
    choices: [50, 75]
    default: 50
    explanation: "Fewer noise duplicates than the full profile (100–150)."

  diffusion_type:
    type: categorical
    suggest: categorical
    choices: [vp, flow]
    default: flow
    explanation: "Flow is faster; VP kept as an alternative."

  max_depth:
    type: int
    suggest: int
    low: 3
    high: 7
    default: 5

  n_estimators:
    type: categorical
    suggest: categorical
    choices: [50, 100]
    default: 50

  eta:
    type: float
    suggest: float
    low: 0.05
    high: 0.5
    log: true
    default: 0.3
