# Dataset registry — 15 SYNTH_BENCHMARK datasets.
# Paths relative to repo root; UCI entries need `ucimlrepo`.
#
# Global sampling (applied in datasets/loader.py unless overridden per dataset):
#   max_samples:       randomly keep at most this many rows (after preprocess)
#   balance_classes:   for classification, sample equally across target classes
#   impute:            median/mode imputation (train-fit) before generator training
#   encode_categorical: label-encode categoricals / discrete cols to integer codes
#   max_int_categories: treat integer-like cols with ≤N unique values as discrete/categorical
#   normalize_numeric: optional StandardScaler on continuous numeric features (default off)
#
# Phase 1 — first 9 classification datasets:
#   cancer, alzheimers, adult, forest_cover, bank_marketing,
#   wine_quality, cdc_diabetes, mushroom, magic_gamma
# Phase 2 — remaining 6 regression datasets (later):
#   metro_interstate, online_shopping, air_quality,
#   concrete, energy_efficiency, real_estate

defaults:
  max_samples: 1000
  balance_classes: true
  sample_seed: 42
  # Preprocessing before generator training (fit on train, apply to test):
  impute: true              # median (numeric) / mode (categorical); replaces row dropna
  encode_categorical: true  # label-encode categoricals + discrete cols to 0..K-1 codes
  max_int_categories: 20    # integer-like columns with ≤20 unique values → discrete/categorical
  normalize_numeric: false  # optional StandardScaler on continuous numeric features (generators vary)

datasets:
  cancer:
    display_name: "1. Cancer"
    source: csv
    path: Datasets/Cancer.csv
    task: classification
    target: diagnosis
    test_size: 0.2
    seed: 42
    drop_columns: [id]
    drop_unnamed: true
    target_map: {M: 1, B: 0}

  alzheimers:
    display_name: "2. Alzhimers"
    source: excel
    path: Datasets/Alzhimers.xlsx
    task: classification
    target: Group
    test_size: 0.2
    seed: 42
    drop_columns: ["Subject ID", "MRI ID", "M/F", "Hand"]
    target_map: {Demented: 1, Nondemented: 0, Converted: 1}

  adult:
    display_name: "3. Adult"
    source: csv
    path: Datasets/adult_census.csv
    task: classification
    target: income
    test_size: 0.2
    seed: 42
    na_values: ["?", " ?"]
    target_map:
      "<=50K": 0
      "<=50K.": 0
      ">50K": 1
      ">50K.": 1
      " <=50K": 0
      " <=50K.": 0
      " >50K": 1
      " >50K.": 1

  forest_cover:
    display_name: "4. Forest Cover"
    source: uci
    uci_id: 31
    task: classification
    target: Cover_Type
    test_size: 0.2
    seed: 42
    # Soil/wilderness one-hots are binary ints. Treating ~40 of them as
    # categorical makes CTAB-GAN+ rejection sampling hang and return empty.
    # Only the multi-class target is categorical for synth models.
    max_int_categories: 0
    categorical_columns: [Cover_Type]

  bank_marketing:
    display_name: "5. Bank Marketing"
    source: csv
    path: Datasets/bank-full.csv
    sep: ";"
    task: classification
    target: y
    test_size: 0.2
    seed: 42

  wine_quality:
    display_name: "6. Wine Quality"
    source: csv
    path: Datasets/winequality-white.csv
    sep: ";"
    task: classification
    target: quality
    test_size: 0.2
    seed: 42

  cdc_diabetes:
    display_name: "7. CDC Diabetes"
    source: uci
    uci_id: 891
    task: classification
    target: Diabetes_binary
    test_size: 0.2
    seed: 42

  mushroom:
    display_name: "8. Mushroom"
    source: uci
    uci_id: 73
    task: classification
    target: poisonous
    test_size: 0.2
    seed: 42

  magic_gamma:
    display_name: "9. MAGIC Gamma"
    source: uci
    uci_id: 159
    task: classification
    target: class
    test_size: 0.2
    seed: 42

  metro_interstate:
    display_name: "10. Metro Interstate"
    source: uci
    uci_id: 492
    task: regression
    target: traffic_volume
    test_size: 0.2
    seed: 42
    # High-cardinality timestamp (~1 unique per row) breaks CTAB-GAN's 32×32 layout.
    drop_columns: [date_time]

  online_shopping:
    display_name: "11. Online Shopping"
    source: csv
    path: Datasets/e-shop.csv
    sep: ";"
    task: regression
    target: "price 2"
    test_size: 0.2
    seed: 42
    # session ID: near-unique ID. page 2: ~188 clothing SKUs — high card breaks CTAB-GAN sampling.
    drop_columns: ["session ID", "page 2 (clothing model)"]
    # day (31) / order (57) as continuous cause CTAB-GAN rejection-sampling hangs.
    max_int_categories: 60
    categorical_columns: ["year", "day", "order"]

  air_quality:
    display_name: "12. Air Quality"
    source: uci
    uci_id: 360
    task: regression
    target: AH
    test_size: 0.2
    seed: 42
    # Date/Time are high-cardinality / non-generative for tabular synth (esp. CTAB-GAN).
    drop_columns: [Date, Time]

  concrete:
    display_name: "13. Concrete"
    source: uci
    uci_id: 165
    task: regression
    target: Concrete compressive strength
    test_size: 0.2
    seed: 42

  energy_efficiency:
    display_name: "14. Energy Efficiency"
    source: uci
    uci_id: 242
    task: regression
    target: Y1
    test_size: 0.2
    seed: 42

  real_estate:
    display_name: "15. Real Estate"
    source: uci
    uci_id: 477
    task: regression
    target: "Y house price of unit area"
    test_size: 0.2
    seed: 42
    # Transaction date is near-continuous / high-card for synth; drop like other date fields.
    drop_columns: ["X1 transaction date"]